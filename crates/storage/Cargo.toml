[package]
name = "r-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
r-crypto = { path = "../crypto" }
redb.workspace = true
serde.workspace = true
bincode.workspace = true
thiserror.workspace = true
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand.workspace = true
hex.workspace = true
tantivy = "0.22"
chacha20poly1305 = "0.10"

[dev-dependencies]
tempfile = "3.10"

[[bench]]
name = "crypto_benches"
harness = false
path = "../../benches/crates-bench/storage/lib.rs"
